name: Code Quality Workflow

on: workflow_call

jobs:
  code_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v1.0.0

      # Optional: avoids Docker Hub pull rate limits. Skipped if the secret is absent.
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # exposes ACTIONS_RUNTIME_TOKEN / cache URLs to docker compose for the gha layer cache (docker-compose-ci.yml)
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Deploy stack (CI)
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) make docker.deploy.ci

      - name: Wait for container
        run: castor barlito:castor:wait-php-container

      - name: Configure Composer GitHub token
        run: make composer.command args="config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: make composer.install

      # /app is bind-mounted: the tools write their caches on the runner, as the runner uid
      # phpcs resolves the ruleset's cache arg relative to the ruleset (vendor/barlito/utils/config), not the cwd
      - name: Cache quality tools
        uses: actions/cache@v5
        with:
          path: |
            .php-cs-fixer.cache
            vendor/barlito/utils/config/.phpcs-cache
          key: quality-${{ hashFiles('composer.lock') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ hashFiles('composer.lock') }}-
            quality-

      - name: PHP CS Fixer (dry-run)
        run: make cs_fixer.dry_run

      - name: PHP CodeSniffer
        run: make phpcs

      - name: PHP Mess Detector
        run: make phpmd

      - name: Undeploy stack
        if: always()
        run: make docker.undeploy.ci
