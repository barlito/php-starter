name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to current branch/tag)"
        required: false
        type: string
      re-deploy:
        description: "Full stack deploy (applies all of docker-compose-prod.yml, rolling update with rollback) instead of the image-only update"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A crash-looping container must not keep the job spinning
    timeout-minutes: 15

    env:
      DOCKER_HOST: ssh://${{ vars.SERVER_USERNAME }}@${{ vars.SERVER_HOST }}:${{ vars.SERVER_PORT }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      DEPLOY_TAG: ${{ inputs.tag || github.ref_name }}
      # Read by docker-compose-prod.yml and by `make deploy.assert_image`
      DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v1.1.0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ vars.SERVER_PORT }} ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # No `stack rm`: deploy.prod rolls the existing stack (creates it on a first deploy)
      - name: Re-Deploy Stack
        if: inputs.re-deploy
        run: TAG=$DEPLOY_TAG make deploy.prod

      - name: Backup database
        if: ${{ ! inputs.re-deploy }}
        run: make db.backup

      - name: Drain worker
        if: ${{ ! inputs.re-deploy }}
        run: docker service scale ${STACK_NAME:-starter}_message_worker=0 || true

      - name: Update main service + migrate
        if: ${{ ! inputs.re-deploy }}
        env:
          STACK_NAME: starter
        run: |
          make docker.service.update args="--image $DOCKER_IMAGE:$DEPLOY_TAG ${STACK_NAME}_php"
          TAG=$DEPLOY_TAG make deploy.assert_image
          make doctrine.migrate

      - name: Update & restart worker
        if: ${{ ! inputs.re-deploy }}
        env:
          STACK_NAME: starter
        run: |
          make docker.service.update args="--image $DOCKER_IMAGE-worker:$DEPLOY_TAG ${STACK_NAME}_message_worker"
          docker service scale ${STACK_NAME}_message_worker=1

      - name: Smoke test
        if: ${{ ! inputs.re-deploy }}
        run: make smoke.test

      - name: Remove stopped containers
        if: ${{ ! inputs.re-deploy }}
        run: make deploy.prune
