name: Deploy

# Run on the release tag: gh workflow run deploy.yaml --ref vX.Y.Z

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: "Full stack deploy (applies all of docker-compose-prod.yml, rolling update with rollback) instead of the image-only update"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      full: ${{ inputs.re-deploy }}
      images: barlito/starter barlito/starter-worker
      env-secrets: DB_PASSWORD APP_SECRET
      castor: true
    secrets: inherit
