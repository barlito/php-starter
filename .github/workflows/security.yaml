name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    uses: barlito/ci/.github/workflows/image-scan.yaml@v1
    with:
      dockerfile: .docker/Dockerfile
      target: frankenphp_prod
      fail-on-findings: true
    secrets: inherit
