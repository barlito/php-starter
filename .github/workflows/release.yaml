name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: barlito/ci/.github/workflows/docker-release.yaml@v1
    with:
      images: '[{"name":"starter","target":"frankenphp_prod"},{"name":"starter-worker","target":"frankenphp_worker_prod"}]'
      dockerfile: .docker/Dockerfile
    secrets: inherit
