name: Starter workflow

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  init_symfony_starter:

    runs-on: ubuntu-latest
    # A hung container must not hold the runner for 6 hours
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      # COMPOSER_HOME is bind-mounted from ~/.composer; no lock exists before symfony.install, hence the sha key
      - name: Cache Composer Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ github.sha }}
          restore-keys: composer-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # exposes ACTIONS_RUNTIME_TOKEN / cache URLs to docker compose for the gha layer cache
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Deploy stack
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) make docker.deploy.ci

      - name: Install Symfony app
        run: make symfony.install

      # before any GitHub VCS install: unauthenticated, composer hits the shared-IP API rate limit and waits for a token on the TTY
      - name: Setup github token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make composer.command args="config -g github-oauth.github.com $GITHUB_TOKEN"

      - name: Install barlito/utils
        run: make package.barlito_utils.install

      - name: Check app works well
        run: "curl -I http://localhost:8081/ | grep -qi 'Server: FrankenPHP'"

      - name: Install phpunit
        run: make phpunit.install

      - name: Install behat
        run: make behat.install

      - name: Init behat
        run: make behat.init

      - name: Install php cs fixer
        run: make cs_fixer.install

      - name: Install php cs
        run: make phpcs.install

      - name: Install phpmd
        run: make phpmd.install

#     Dry run only to avoid action to fail because of Symfony fresh files
      - name: Run php cs fixer
        continue-on-error: true
        run: make cs_fixer

      - name: Run php cs
        run: make phpcs

      - name: Run phpmd
        run: make phpmd

      - name: Run phpunit
        run: make phpunit

      - name: Run behat
        run: make behat

      - name: Undeploy stack
        run: make docker.undeploy.ci

