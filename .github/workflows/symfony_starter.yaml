name: Starter workflow

on: push

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  init_symfony_starter:

    runs-on: ubuntu-latest
    # A hung container must not hold the runner for 6 hours
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup castor
        uses: castor-php/setup-castor@v0.1.0

      # COMPOSER_HOME is bind-mounted from ~/.composer; no lock exists before symfony.install, hence the sha key
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ github.sha }}
          restore-keys: composer-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # exposes ACTIONS_RUNTIME_TOKEN / cache URLs to docker compose for the gha layer cache
      - name: Expose GitHub runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Deploy stack
        run: USER_ID=$(id -u) GROUP_ID=$(id -g) make docker.deploy.ci

      - name: Install Symfony app
        run: make symfony.install

      - name: Install barlito/utils
        run: make package.barlito_utils.install

      - name: Check app works well
        run: "curl -I http://localhost:8081/ | grep -qi 'Server: FrankenPHP'"

      - name: Setup github token
        run: make composer.command args="config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}"

      - name: Install phpunit
        run: make phpunit.install

      - name: Install behat
        run: make behat.install

      - name: Init behat
        run: make behat.init

      - name: Install php cs fixer
        run: make cs_fixer.install

      - name: Install php cs
        run: make phpcs.install

      - name: Install phpmd
        run: make phpmd.install

#     Dry run only to avoid action to fail because of Symfony fresh files
      - name: Run php cs fixer
        continue-on-error: true
        run: make cs_fixer

      - name: Run php cs
        run: make phpcs

      - name: Run phpmd
        run: make phpmd

      - name: Run phpunit
        run: make phpunit

      - name: Run behat
        run: make behat

      - name: Undeploy stack
        run: make docker.undeploy.ci

