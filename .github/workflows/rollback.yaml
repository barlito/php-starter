name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to rollback to (e.g. v1.2.0)"
        required: true
        type: string
      restore-database:
        description: "Restore the database from the backup taken while this tag was running, instead of reverting the migrations"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  rollback:
    uses: barlito/ci/.github/workflows/swarm-rollback.yaml@v1
    with:
      tag: ${{ inputs.tag }}
      restore: ${{ inputs.restore-database && '1' || '' }}
      images: barlito/starter barlito/starter-worker
      env-secrets: DB_PASSWORD APP_SECRET
      castor: true
    secrets: inherit
